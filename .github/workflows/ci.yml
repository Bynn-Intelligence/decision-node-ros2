name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.distro }} on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    # The official ROS image for the distribution, the same on amd64 and arm64.
    container:
      image: ros:${{ matrix.distro }}-ros-base
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { distro: humble, runner: ubuntu-22.04 }
          - { distro: humble, runner: ubuntu-22.04-arm }
          - { distro: jazzy, runner: ubuntu-24.04 }
          - { distro: jazzy, runner: ubuntu-24.04-arm }
          - { distro: rolling, runner: ubuntu-24.04 }
          - { distro: rolling, runner: ubuntu-24.04-arm }
    steps:
      # The Rolling image comes with ROS's testing apt source, which setup-ros keeps.
      - uses: ros-tooling/setup-ros@649ef6bcd696da05bc27ceb3fab69d810c0daeab # 0.7.19
        with:
          required-ros-distributions: ${{ matrix.distro }}
          use-ros2-testing: ${{ matrix.distro == 'rolling' }}

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      # The DecisionNode Python SDK has no rosdep key yet, so it is installed from PyPI,
      # for the user, so pip never replaces a package the system installed.
      - name: Install the DecisionNode Python SDK
        env:
          PIP_BREAK_SYSTEM_PACKAGES: "1"
        run: python3 -m pip install --user "bynn-decisionnode>=0.3.2,<0.4"

      - uses: ros-tooling/action-ros-ci@3a640b10f09b756dabe556dac5413aba369f71b0 # 0.4.8
        with:
          target-ros2-distro: ${{ matrix.distro }}
          package-name: decisionnode_msgs decisionnode_ros
          import-token: ${{ github.token }}
